</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const TL = await (await fetch('timeline.json')).json();
await Promise.all([600,700,800,900].map(w=>document.fonts.load(`${w} 40px Inter`)));
const logo = new Image(); logo.src='logo.png'; await logo.decode();

const W=TL.words, G=TL.groups, KW=new Set(TL.kw), SC=TL.scenes, BEAT=60/TL.bpm;
const T=i=>W[i][0], E=i=>W[i][2];
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const WD=1080, HT=1920;

// ---------- utils ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,t0,d)=>clamp((t-t0)/d);
const eOut=p=>1-Math.pow(1-p,3);
const eInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eBack=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)}
const fmt=n=>Math.round(n).toLocaleString('it-IT');
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function pop(t,t0,d=.38){const p=prog(t,t0,d);return {s:p<=0?0:lerp(.55,1,eBack(p)),a:clamp(p*4),p}}
function withT(cx,cy,s,a,fn){if(a<=0||s<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(cx,cy);ctx.scale(s,s);ctx.translate(-cx,-cy);fn();ctx.restore()}
function card(x,y,w,h,o={}){
  const {r=40,fill='#fff'}=o;
  ctx.save();ctx.shadowColor='rgba(10,15,50,.28)';ctx.shadowBlur=60;ctx.shadowOffsetY=24;
  rr(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.restore();
}
function txt(s,x,y,{size=40,w=700,c='#10131f',al='left',bl='alphabetic',ls=0}={}){
  ctx.font=`${w} ${size}px Inter`;ctx.fillStyle=c;ctx.textAlign=al;ctx.textBaseline=bl;ctx.letterSpacing=`${ls}px`;ctx.fillText(s,x,y);ctx.letterSpacing='0px'}
function pill(s,cx,cy,{size=36,bg='#fff',c='#10131f',w=800,pad=30}={}){
  ctx.font=`${w} ${size}px Inter`;const tw=ctx.measureText(s).width;const h=size*1.9;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=30;ctx.shadowOffsetY=10;
  rr(cx-tw/2-pad,cy-h/2,tw+pad*2,h,h/2);ctx.fillStyle=bg;ctx.fill();ctx.restore();
  txt(s,cx,cy+size*.36,{size,w,c,al:'center'});return tw+pad*2}
function check(cx,cy,r,p,col='#19c37d'){
  if(p<=0)return;const s=eBack(clamp(p*1.6));
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fillStyle=col;ctx.fill();
  const q=clamp((p-.25)/.5);ctx.strokeStyle='#fff';ctx.lineWidth=r*.24;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  const pts=[[-.45*r,0],[-.12*r,.32*r],[.48*r,-.32*r]];ctx.moveTo(...pts[0]);
  if(q<.4){const k=q/.4;ctx.lineTo(lerp(pts[0][0],pts[1][0],k),lerp(pts[0][1],pts[1][1],k))}
  else{ctx.lineTo(...pts[1]);const k=(q-.4)/.6;ctx.lineTo(lerp(pts[1][0],pts[2][0],k),lerp(pts[1][1],pts[2][1],k))}
  ctx.stroke();ctx.restore()}
function stampTxt(s,cx,cy,t,t0,col,rot=-.12,size=34){
  const p=prog(t,t0,.22);if(p<=0)return;const sc=lerp(2.2,1,eOut(p));
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.scale(sc,sc);ctx.globalAlpha*=clamp(p*3);
  ctx.font=`900 ${size}px Inter`;const tw=ctx.measureText(s).width;
  ctx.strokeStyle=col;ctx.lineWidth=5;rr(-tw/2-18,-size*.85,tw+36,size*1.7,12);ctx.stroke();
  txt(s,0,size*.36,{size,w:900,c:col,al:'center'});ctx.restore()}
function bar(x,y,w,h,p,col,bg='#eef0f6'){rr(x,y,w,h,h/2);ctx.fillStyle=bg;ctx.fill();if(p>0){rr(x,y,Math.max(h,w*p),h,h/2);ctx.fillStyle=col;ctx.fill()}}
function avatar(cx,cy,r,s,c1,c2){const g=ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);g.addColorStop(0,c1);g.addColorStop(1,c2);
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle=g;ctx.fill();txt(s,cx,cy+r*.36,{size:r*.95,w:900,c:'#fff',al:'center'})}
function wrapLines(s,maxW,size,w){ctx.font=`${w} ${size}px Inter`;const out=[];let cur='';for(const word of s.split(' ')){const tst=cur?cur+' '+word:word;if(ctx.measureText(tst).width>maxW&&cur){out.push(cur);cur=word}else cur=tst}out.push(cur);return out}

// ---------- palettes ----------
const P={pink:['#ff3d7f','#ff9f43'],violet:['#6a2cf5','#c062e8'],blue:['#1d4bff','#13b4ff'],green:['#00a676','#45e07d'],
 navy:['#070b26','#16205a'],navy2:['#0d0826','#2b1263'],orange:['#ff5e00','#ffbd2e'],teal:['#008f9e','#26e0c0'],red:['#ff2e4d','#ff8a5c']};
 const DARK=new Set(['navy','navy2','night']);P.night=['#05061a','#141a44'];P.white=['#f4f6ff','#dfe6ff'];P.wood=['#8a4b1f','#d08a45'];P.grey=['#3a3f52','#6b7185'];P.mint=['#00b39f','#7af0c6'];P.rose=['#ff5fa2','#ffb3c7'];

// ---------- three ----------
const R3=760;
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
ren.setSize(R3,R3,false);ren.setPixelRatio(1);ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.05;
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;ren.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();const pm=new THREE.PMREMGenerator(ren);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
const cam=new THREE.PerspectiveCamera(32,1,.1,100);cam.position.set(0,1.2,11);cam.lookAt(0,0,0);
const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(4,8,6);key.castShadow=true;key.shadow.mapSize.set(1024,1024);
Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6});key.shadow.radius=8;scene.add(key);
scene.add(new THREE.AmbientLight(0xffffff,.35));
const rim=new THREE.DirectionalLight(0x88aaff,1.2);rim.position.set(-6,3,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:.22}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.6;floor.receiveShadow=true;scene.add(floor);
const M=(color,o={})=>new THREE.MeshPhysicalMaterial({color,metalness:.1,roughness:.25,clearcoat:1,clearcoatRoughness:.08,...o});
const gold=()=>M(0xffc53d,{metalness:1,roughness:.22});
function sh(m){m.traverse(o=>{if(o.isMesh){o.castShadow=true}});return m}
function texCanvas(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=4;return {c,x,tx,redraw:(...a)=>{draw(x,...a);tx.needsUpdate=true}}}
function phone(bodyCol,screenDraw){
  const g=new THREE.Group();const body=new THREE.Mesh(new RoundedBoxGeometry(2.3,4.6,.28,6,.32),M(bodyCol,{metalness:.8,roughness:.25}));g.add(body);
  const st=texCanvas(512,1024,screenDraw);st.redraw(0);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(2.08,4.36),new THREE.MeshBasicMaterial({map:st.tx,toneMapped:false}));scr.position.z=.145;g.add(scr);
  g.userData.st=st;return sh(g)}
const S3={}; // name -> {group, update(t)}
function add3(name,group,update){group.visible=false;scene.add(group);S3[name]={group,update}}
function drawBg(pal,t){
  const [a,b]=P[pal];const g=ctx.createLinearGradient(0,0,WD*.6,HT);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,WD,HT);
  const ph=(t%BEAT)/BEAT, pulse=Math.exp(-ph*5);
  const blobs=[[.2,.25,.9],[.85,.6,1.1],[.35,.9,.8]];
  ctx.save();ctx.globalCompositeOperation='screen';
  blobs.forEach(([x,y,r],k)=>{const bx=WD*(x+.12*Math.sin(t*.7+k*2)),by=HT*(y+.06*Math.cos(t*.5+k)), R=520*r*(1+.12*pulse);
    const rg=ctx.createRadialGradient(bx,by,0,bx,by,R);const al=(DARK.has(pal)?.30:.22)+.18*pulse;
    const col=DARK.has(pal)?(k===1?'90,120,255':'170,80,255'):'255,255,255';
    rg.addColorStop(0,`rgba(${col},${al})`);rg.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=rg;ctx.fillRect(0,0,WD,HT)});
  ctx.restore();
  // subtle grain-free vignette
  const v=ctx.createRadialGradient(WD/2,HT/2,HT*.3,WD/2,HT/2,HT*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.18)');ctx.fillStyle=v;ctx.fillRect(0,0,WD,HT);
}
function circleClip(cx,cy,r,fn){ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();fn();ctx.restore()}
